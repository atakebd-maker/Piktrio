<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="45%" stop-color="#0077FF"/>
      <stop offset="100%" stop-color="#0044FF"/>
    </linearGradient>

    <!-- Swoosh Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="55%" stop-color="#0088FF"/>
      <stop offset="100%" stop-color="#0040EE"/>
    </linearGradient>

    <!-- Camera Navy -->
    <linearGradient id="cameraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003DB8"/>
      <stop offset="35%" stop-color="#051B5A"/>
      <stop offset="100%" stop-color="#02103E"/>
    </linearGradient>

    <!-- Star Gradients -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C0FF"/>
      <stop offset="100%" stop-color="#0044FF"/>
    </linearGradient>

    <!-- Aperture Blade Gradients -->
    <linearGradient id="bladeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="bladeUpperRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0022AA"/>
    </linearGradient>
    <linearGradient id="bladeLowerRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0033CC"/>
      <stop offset="100%" stop-color="#6A11CB"/>
    </linearGradient>
    <linearGradient id="bladeBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1FA2"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>
    <linearGradient id="bladeLowerLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055FF"/>
      <stop offset="100%" stop-color="#0033BB"/>
    </linearGradient>
    <linearGradient id="bladeUpperLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>
  </defs>

  <!-- Black Background Canvas -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Squircle App Card -->
  <!-- Outer subtle electric glow -->
  <rect x="20" y="20" width="472" height="472" rx="122" ry="122" fill="none" stroke="#0077FF" stroke-width="24" opacity="0.45"/>
  <!-- Main White Card with Electric Blue Border -->
  <rect x="24" y="24" width="464" height="464" rx="118" ry="118" fill="#FFFFFF" stroke="url(#borderGrad)" stroke-width="17"/>

  <!-- Camera Body Silhouette -->
  <path d="
    M 172 162
    C 182 135, 194 118, 222 118
    L 298 118
    C 326 118, 338 135, 348 162
    L 375 174
    C 392 182, 398 194, 398 220
    L 398 226
    L 416 226
    C 424 226, 428 232, 428 240
    L 428 322
    C 428 330, 424 336, 416 336
    L 398 336
    L 398 340
    C 398 365, 382 376, 355 376
    L 155 376
    C 128 376, 112 365, 112 340
    L 112 220
    C 112 194, 118 182, 135 174
    Z"
    fill="none" stroke="url(#cameraGrad)" stroke-width="21" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Grip slot inner accent -->
  <path d="M 398 246 L 398 316" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>

  <!-- Shutter Lens Outer Ring (Dark Navy) -->
  <circle cx="260" cy="265" r="95" fill="#031448"/>
  <!-- Thin white spacer -->
  <circle cx="260" cy="265" r="82" fill="#FFFFFF"/>

  <!-- Aperture Iris (Diameter 160) -->
  <g transform="translate(260, 265)">
    <clipPath id="lensClip">
      <circle cx="0" cy="0" r="78"/>
    </clipPath>

    <g clip-path="url(#lensClip)">
      <!-- 6 Symmetrical Pie / Shutter Blades with overlapping radial geometry -->
      <!-- 1. Top Blade (-60 to 0 deg relative to vertical) -->
      <path d="M 0 0 L -45 -70 L 45 -70 Z" fill="url(#bladeTop)"/>
      <path d="M 0 0 L -80 -30 L -40 -75 L 40 -75 Z" fill="url(#bladeTop)"/>

      <!-- 2. Upper Right (0 to 60 deg) -->
      <path d="M 0 0 L 40 -75 L 80 -25 L 75 35 Z" fill="url(#bladeUpperRight)"/>

      <!-- 3. Lower Right (60 to 120 deg) -->
      <path d="M 0 0 L 75 35 L 75 75 L 15 78 Z" fill="url(#bladeLowerRight)"/>

      <!-- 4. Bottom (120 to 180 deg) -->
      <path d="M 0 0 L 15 78 L -45 78 L -80 40 Z" fill="url(#bladeBottom)"/>

      <!-- 5. Lower Left (180 to 240 deg) -->
      <path d="M 0 0 L -80 40 L -80 -25 L -45 -25 Z" fill="url(#bladeLowerLeft)"/>

      <!-- 6. Upper Left (240 to 300 deg) -->
      <path d="M 0 0 L -80 -25 L -40 -75 L 0 -15 Z" fill="url(#bladeUpperLeft)"/>

      <!-- Aperture Blade Seams (Thin White Lines) -->
      <line x1="0" y1="0" x2="42" y2="-75" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="0" y1="0" x2="80" y2="15" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="0" y1="0" x2="35" y2="78" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="0" y1="0" x2="-45" y2="78" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="0" y1="0" x2="-80" y2="15" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="0" y1="0" x2="-40" y2="-75" stroke="#FFFFFF" stroke-width="2"/>

      <!-- Center Hexagonal Opening -->
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#FFFFFF"/>

      <!-- Clean Glossy Specular Highlight Dot (Top-Right blade) -->
      <ellipse cx="28" cy="-40" rx="13" ry="8" transform="rotate(-25, 28, -40)" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Dynamic Curved Swoosh Arc looping from bottom-left around under lens -->
  <path d="
    M 42 360
    C 40 405, 95 432, 175 422
    C 248 412, 316 384, 348 348
    C 315 365, 258 378, 195 375
    C 130 372, 85 348, 92 312
    C 98 268, 160 215, 235 228
    C 192 216, 136 242, 95 278
    C 58 312, 42 342, 42 360
    Z"
    fill="url(#swooshGrad)"/>

  <!-- Three 4-Point Sparkle Stars on Top-Right -->
  <!-- Star 1: Large Star (350, 95) -->
  <path d="
    M 350 48
    Q 350 92 394 92
    Q 350 92 350 136
    Q 350 92 306 92
    Q 350 92 350 48 Z"
    fill="url(#starGrad)"/>

  <!-- Star 2: Medium Star (422, 142) -->
  <path d="
    M 422 106
    Q 422 140 456 140
    Q 422 140 422 174
    Q 422 140 388 140
    Q 422 140 422 106 Z"
    fill="url(#starGrad)"/>

  <!-- Star 3: Small Star (442, 208) -->
  <path d="
    M 442 182
    Q 442 206 466 206
    Q 442 206 442 230
    Q 442 206 418 206
    Q 442 206 442 182 Z"
    fill="url(#starGrad)"/>
</svg>