<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="origin">
  <title>Advertisement</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #ad-wrapper {
      position: relative;
      width: 320px;
      height: 50px;
      overflow: hidden;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border: 1px solid #e2e8f0;
    }
    #zone-08b7db13a6d76ff83899aa3766f3e1deb91abd17 {
      width: 320px;
      min-height: 50px;
      display: flex !important;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    #fallback-ad {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      z-index: 1;
    }
    .ad-text {
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .badge {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #93c5fd;
    }
    .ad-title {
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
    }
    .ad-btn {
      padding: 4px 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 6px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="ad-wrapper">
    <div id="zone-08b7db13a6d76ff83899aa3766f3e1deb91abd17"></div>
    <a id="fallback-ad" href="https://bengalads.com/" target="_blank" rel="noopener noreferrer">
      <div class="ad-text">
        <span class="badge">Sponsored &bull; BengalAds Partner</span>
        <span class="ad-title">AI Photo Editing Prompts</span>
      </div>
      <span class="ad-btn">Explore &rarr;</span>
    </a>
  </div>

  <script src="https://bengalads.com/widget-render.php?placement=08b7db13a6d76ff83899aa3766f3e1deb91abd17&target=zone-08b7db13a6d76ff83899aa3766f3e1deb91abd17&width=320&height=50"></script>

  <script>
    (function() {
      var zone = document.getElementById('zone-08b7db13a6d76ff83899aa3766f3e1deb91abd17');
      var fallback = document.getElementById('fallback-ad');
      
      function checkZone() {
        if (!zone) return;
        var isHidden = zone.style.display === 'none' || zone.offsetHeight === 0;
        var hasContent = zone.children && zone.children.length > 0 && zone.innerHTML.trim().length > 10;
        if (isHidden || !hasContent) {
          fallback.style.display = 'flex';
        } else {
          fallback.style.display = 'none';
        }
      }

      setTimeout(checkZone, 800);
      setTimeout(checkZone, 2200);

      if (window.MutationObserver && zone) {
        var observer = new MutationObserver(checkZone);
        observer.observe(zone, { attributes: true, childList: true, subtree: true, attributeFilter: ['style', 'class'] });
      }
    })();
  </script>
</body>
</html>
